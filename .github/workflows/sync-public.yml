name: sync-public

# Fetches the public repo's main and opens a PR into this repo when it is
# ahead, so community contributions can be reviewed and merged here (where
# CI/CD + deployment run). The branch push and gh pr create both use the
# built-in GITHUB_TOKEN - no extra secrets needed.
#
# Public main is normally exactly one commit ahead of this repo (the strip
# commit from mirror-public.yml). More than that means a community PR was
# merged there, so we open the sync PR. The branch is based on public main
# (which lacks the private workflows); those are restored from origin/main
# before pushing so merging the PR never deletes them.
#
# Note: GitHub disables scheduled workflows after 60 days of repo inactivity;
# run it manually (workflow_dispatch) if PRs stop appearing.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch public main
        env:
          PUBLIC_REPO: ${{ vars.PUBLIC_REPO }}
        run: |
          git remote add public "https://github.com/${PUBLIC_REPO}.git"
          git fetch public main
          git remote remove public

      - name: Open sync PR if public is ahead
        run: |
          if [ "$(git rev-list --count origin/main..public/main)" -le 1 ]; then
            echo "public is up to date, nothing to do"
            exit 0
          fi

          if gh pr list --repo "$GITHUB_REPOSITORY" --label from-public --state open --json number --jq 'length' | grep -qv '^0$'; then
            echo "sync PR already open"
            exit 0
          fi

          git switch -c sync-from-public public/main
          git checkout origin/main -- .github/workflows/deploy.yml .github/workflows/mirror-public.yml .github/workflows/sync-public.yml
          git commit -q -m "chore: keep private workflows out of the sync PR" || true
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" sync-from-public

          gh pr create \
            --base main \
            --head sync-from-public \
            --title "Sync from public repo" \
            --body "The public repo is ahead of this one. Merge to bring community contributions into the deployment pipeline." \
            --label from-public \
            --repo "$GITHUB_REPOSITORY"