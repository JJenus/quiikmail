name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Package output
        run: tar czf quiikmail-output.tar.gz -C .output .

      - name: Upload to server
        env:
          SSH_USER: ${{ secrets.ALWAYSDATA_SSH_USER }}
          SSH_KEY: ${{ secrets.ALWAYSDATA_SSH_KEY }}
          SSH_HOST: ${{ secrets.ALWAYSDATA_SSH_HOST }}
        run: |
          echo "$SSH_KEY" > /tmp/ad_key
          chmod 600 /tmp/ad_key
          scp -i /tmp/ad_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null quiikmail-output.tar.gz "$SSH_USER@$SSH_HOST":~
          ssh -i /tmp/ad_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$SSH_USER@$SSH_HOST" '
            mv ~/app/.output ~/app/.output.old-$(date +%Y%m%d-%H%M%S)
            mkdir -p ~/app/.output
            tar xzf ~/quiikmail-output.tar.gz -C ~/app/.output
            rm ~/quiikmail-output.tar.gz
          '

      - name: Restart site via AlwaysData API
        env:
          API_KEY: ${{ secrets.ALWAYSDATA_API_KEY }}
          ACCOUNT: ${{ secrets.ALWAYSDATA_ACCOUNT }}
          SITE_ID: ${{ secrets.ALWAYSDATA_SITE_ID }}
        run: |
          curl -sS -X POST --basic --user "$API_KEY account=$ACCOUNT:" \
            "https://api.alwaysdata.com/v1/site/$SITE_ID/restart/"