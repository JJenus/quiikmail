name: mirror-public

# Pushes this repo's main to the public repo, stripped of the private
# workflows (deploy/mirror/sync stay here; the public repo only ships
# ci.yml). Authentication is a fine-grained PAT (secrets.PUBLIC_SYNC_TOKEN)
# scoped to the public repo with Contents + Workflows write access - a
# deploy key cannot push workflow file changes, a PAT can.
#
# The public tip is always one commit ahead of this repo: the "strip"
# commit that removes the private workflows. Any other public-only commit
# means a community PR was merged on public before being synced back -
# then we skip and let sync-public.yml open a PR instead, so a mirror can
# never clobber an unsynced community contribution.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Strip private workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -q --cached .github/workflows/deploy.yml .github/workflows/mirror-public.yml .github/workflows/sync-public.yml
          git commit -q -m "chore: strip private workflows from public mirror"

      - name: Push to public repo
        env:
          PUBLIC_REPO: ${{ vars.PUBLIC_REPO }}
          TOKEN: ${{ secrets.PUBLIC_SYNC_TOKEN }}
        run: |
          git remote add public "https://x-access-token:${TOKEN}@github.com/${PUBLIC_REPO}.git"
          git fetch -q public main

          # Public-only commits: exactly 1 (the strip commit) is healthy.
          # More than that means community content sits on public main.
          PUB_EXTRA=$(git rev-list --count origin/main..public/main)
          if [ "$PUB_EXTRA" -gt 1 ]; then
            echo "public repo has community content not synced back yet - skipping mirror, sync-public will open a PR"
            exit 0
          fi

          # Nothing new to mirror (public tip == strip commit of our HEAD).
          if [ "$(git rev-parse public/main^)" = "$(git rev-parse HEAD)" ]; then
            echo "public repo is up to date"
            exit 0
          fi

          git push -f public HEAD:main
          git remote remove public