name: mirror-public

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Push to public repo
        env:
          PUBLIC_REPO: ${{ vars.PUBLIC_REPO }}
          TOKEN: ${{ secrets.PUBLIC_SYNC_TOKEN }}
        run: |
          git remote add public "https://x-access-token:${TOKEN}@github.com/${PUBLIC_REPO}.git"
          git push -f public HEAD:main
          git remote remove public