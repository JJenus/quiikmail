name: mirror-public

# Force-pushes this repo's main to the public repo. The public repo only
# ships ci.yml, so this never triggers anything there. Authentication is a
# write deploy key (secrets.PUBLIC_SYNC_KEY) that is scoped to the public
# repo only.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Push to public repo
        env:
          PUBLIC_REPO: ${{ vars.PUBLIC_REPO }}
          SSH_KEY: ${{ secrets.PUBLIC_SYNC_KEY }}
        run: |
          echo "$SSH_KEY" > /tmp/gh_key
          chmod 600 /tmp/gh_key
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          GIT_SSH_COMMAND="ssh -i /tmp/gh_key -o IdentitiesOnly=yes" \
            git push -f "git@github.com:${PUBLIC_REPO}.git" HEAD:main