name: mirror-public

# Pushes this repo's main to the public repo, stripped of the private
# workflows (deploy/mirror/sync stay here; the public repo only ships
# ci.yml). Authentication is a write deploy key (secrets.PUBLIC_SYNC_KEY)
# scoped to the public repo only; the ruleset on public main lists that
# key as a bypass actor so the push is allowed.
#
# The push only happens when the content matches (public main == this
# tree minus the stripped workflows). If the public repo has commits with
# new content that hasn't been synced back yet, this skips and lets
# sync-public.yml open a PR instead - so a mirror can never clobber an
# unsynced community contribution.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Strip private workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -q --cached .github/workflows/deploy.yml .github/workflows/mirror-public.yml .github/workflows/sync-public.yml
          git commit -q -m "chore: strip private workflows from public mirror"

      - name: Push to public repo when content matches
        env:
          PUBLIC_REPO: ${{ vars.PUBLIC_REPO }}
          SSH_KEY: ${{ secrets.PUBLIC_SYNC_KEY }}
        run: |
          echo "$SSH_KEY" > /tmp/gh_key
          chmod 600 /tmp/gh_key
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i /tmp/gh_key -o IdentitiesOnly=yes"

          git remote add public "git@github.com:${PUBLIC_REPO}.git"
          git fetch -q public main

          if git diff --quiet public/main HEAD; then
            git push -f public HEAD:main
          else
            echo "public repo has content not synced back yet - skipping mirror, sync-public will open a PR"
          fi